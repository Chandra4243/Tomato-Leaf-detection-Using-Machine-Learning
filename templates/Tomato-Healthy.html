<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.1/css/bootstrap.min.css"
        integrity="sha384-VCmXjywReHh4PwowAiWNagnWcLhlEJLA5buUprzK8rxFgeH0kww/aWY76TfkUoSX" crossorigin="anonymous">

    <title>Tomato Leaf Disease Detection</title>

    <style>
        body {
            background-image: url("{{url_for('static',filename = 'images/Back.jpg')}}");
            background-size: cover;
        }

        header, footer {
            background-color: #8cc63f;
            padding: 30px;
            color: white;
            text-align: center;
        }

        header h1 {
            margin-bottom: 0;
            font-size: 4rem;
        }

        footer p {
            margin: 0;
        }

        .border img {
            border-radius: 15px;
            border: 2px solid black;
            max-width: 100%;
            height: auto;
        }

        .container {
            padding: 40px;
        }

        .col-sm {
            flex: 1;
            margin: 10px;
        }

        .content-h1 {
            padding: 15px;
            background-color: rgb(134, 206, 101);
            color: white;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 15px;
        }

        .details {
            text-align: left;
        }

        h4 {
            margin-bottom: 10px;
        }

        h6 {
            line-height: 1.5; /* Improved readability */
        }
    </style>
</head>

<body>

    <header>
        <h1>Predict Tomato Leaf Disease & Get Cure</h1>
    </header>

    <div class="container my-2">
        <div class="row mb-5">

            <div class="col-sm" style="margin-bottom: 23px;">
                <span class="border border-primary">
                    <img src="{{url_for('static',filename = 'images/Tomato___healthy .JPG')}}" alt="User Image">
                </span>
            </div>

            <div class="col-sm">
                <div>
                    <h1 class="content-h1">
                        {{pred_output}}
                    </h1>
                </div>
                <div class="details">
                    <h4><b>There is no disease on the Tomato leaf.</b></h4>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Developed by Chandrabhushan</p>
    </footer>

</body>

</html>
